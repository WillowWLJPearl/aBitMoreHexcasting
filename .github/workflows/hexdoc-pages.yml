name: Build & Deploy Hexdoc Book

on:
  push:
    branches: ["1.20.1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      # hexdoc uses this for correct base URLs in CI
      GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (editable) + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build site
        run: |
          hexdoc ci build

      - name: Deploy to gh-pages/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site/src/docs
          destination_dir: docs

name: Build the web book

on:
  push:
    branches: [ "1.20.1" ]  # or main, pick the branch you actually push docs from
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hexdoc:
    uses: hexdoc-dev/actions/.github/workflows/hexdoc.yml@v1
    permissions:
      contents: write
      pages: read
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      python-version: "3.11"
